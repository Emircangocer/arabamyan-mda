name: Arabam Yanımda Build

on:
  push:
    branches: [ "main" ] # Kanka ana dalın adı 'master' ise burayı master yap
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest # WinForms olduğu için Windows üzerinde çalışmalı

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    - name: Restore NuGet Packages
      run: nuget restore Arac_Kiralama.sln # Çözüm dosyanın adı farklıysa onu yaz kanka

    - name: Build Solution
      run: msbuild Arac_Kiralama.sln /p:Configuration=Release /p:Platform="Any CPU"